<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷 · LENG — The Sovereign Blade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#06070a}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}

  /* ---- title lockup, bottom-left ---- */
  .lockup{position:fixed;left:clamp(24px,5vw,72px);bottom:clamp(28px,7vh,78px);pointer-events:none;z-index:3}
  .lockup>*{opacity:0;animation:rise 1.3s cubic-bezier(.22,.8,.3,1) forwards}
  .lockup>:nth-child(1){animation-delay:.15s}
  .lockup>:nth-child(2){animation-delay:.45s}
  .lockup>:nth-child(3){animation-delay:.72s}
  .lockup>:nth-child(4){animation-delay:.95s}
  .lockup>:nth-child(5){animation-delay:1.25s}
  @keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  .zh{font-family:'Ma Shan Zheng',serif;font-size:clamp(15px,2vw,20px);letter-spacing:.4em;color:rgba(226,230,238,.82);margin-bottom:10px}
  .name{font-family:Cinzel,serif;font-weight:700;font-size:clamp(46px,7.5vw,86px);line-height:.95;letter-spacing:.2em;color:#edeff2}
  .sub{font-family:Cinzel,serif;font-weight:400;font-size:clamp(10px,1.4vw,13px);letter-spacing:.62em;color:rgba(196,203,214,.78);margin-top:10px}
  .rule{display:flex;align-items:center;gap:14px;margin:20px 0 16px}
  .rule i{display:block;height:1px;width:clamp(90px,16vw,170px);background:rgba(232,236,243,.42)}
  .seal{width:38px;height:38px;background:#9d2b24;color:#f2ebe0;font-family:'Ma Shan Zheng',serif;font-size:23px;display:grid;place-items:center;border-radius:3px;transform:rotate(-4deg)}
  .quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(14px,1.8vw,18px);color:rgba(222,226,233,.85);max-width:360px}

  /* ---- vertical poem, right edge ---- */
  .poem{position:fixed;right:38px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;
    font-family:'Ma Shan Zheng',serif;font-size:19px;letter-spacing:.55em;color:rgba(226,231,240,.5);
    opacity:0;animation:fadeIn 2.4s ease 1.8s forwards;pointer-events:none;z-index:3}
  @keyframes fadeIn{to{opacity:1}}
  @media(max-width:760px){.poem{display:none}}

  /* ---- hint ---- */
  .hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    font-family:Cinzel,serif;font-weight:600;font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(210,216,226,.55);opacity:0;animation:hintIn 1.2s ease 2.4s forwards;pointer-events:none;transition:opacity .9s}
  .hint.gone{opacity:0!important}
  @keyframes hintIn{to{opacity:1}}

  /* ---- character showcase ---- */
  .char-showcase{position:fixed;bottom:120px;right:80px;width:200px;height:280px;pointer-events:none;z-index:2}
  .char-svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(200,225,255,.4))}
  @media(max-width:1024px){.char-showcase{display:none}}

  /* ---- sound toggle ---- */
  .hud{position:fixed;right:26px;bottom:24px;z-index:5}
  .hud button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.16);
    background:rgba(12,14,19,.55);color:#cfd6e0;display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(6px);transition:border-color .25s,color .25s}
  .hud button:hover{border-color:rgba(255,255,255,.42);color:#fff}
  .hud svg{width:17px;height:17px}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="lockup">
  <div class="zh">冷 · 劍仙</div>
  <div class="name">LENG</div>
  <div class="sub">THE SOVEREIGN BLADE</div>
  <div class="rule"><i></i><span class="seal">冷</span></div>
  <div class="quote">&ldquo;When the blade leaves its sheath, even fate must bow.&rdquo;</div>
</div>

<div class="poem">劍出鞘　天命俯首　雷霆為隨</div>
<div class="hint" id="hint">click anywhere &mdash; draw the blade</div>

<div class="char-showcase" id="charShowcase"></div>

<div class="hud">
  <button id="snd" aria-label="toggle sound">
    <svg id="icOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>
    <svg id="icOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
  </button>
</div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   冷 · THE SOVEREIGN BLADE — an ink-wash donghua banner
   A sword immortal, woven from living calligraphy, riding his
   blade above the peaks while the storm answers him.
   ════════════════════════════════════════════════════════════════ */
const cv  = document.getElementById('scene');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const R   = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;

let W = 0, H = 0, DPR = 1;
let FX = 0, FEET = 0, Fh = 400, fxCur = 0, feetCur = 0, fyTop = 0, fcyCur = 0;
let swordX = 0, swordY = 0;
let wind = 0, windT = 0, pX = 0, pY = 0, mX = 0, mY = 0, px = undefined, py;
let flash = 0, swordFlash = 0, now = 0;
let nextBolt = 2.5, nextAuto = 5.5, nextArc = 1.2, nextWisp = 0;

/* ───────────────────────── glyph sprites ───────────────────────── */
const ZH = ['劍','道','天','命','風','雲','雷','雪','霜','心','無','極','斬','冷'];
const LATIN = ['L','E','N','G'];
let glyphs = [];
function buildSprites(){
  glyphs = [];
  const mk = (ch, font) => {
    const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
    const g = c.getContext('2d');
    g.shadowColor = 'rgba(255,255,255,.85)'; g.shadowBlur = 7;
    g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
    g.fillText(ch, s / 2, s / 2 + 3);
    return c;
  };
  ZH.forEach(ch => glyphs.push(mk(ch, '44px "Ma Shan Zheng", serif')));
  LATIN.forEach(ch => glyphs.push(mk(ch, '700 42px Cinzel, serif')));
}
buildSprites();
if (document.fonts){
  document.fonts.load('44px "Ma Shan Zheng"', '劍冷雷').then(buildSprites);
  document.fonts.load('700 42px Cinzel', 'L').then(buildSprites);
  document.fonts.ready.then(buildSprites);
}

/* ─────────────────── the immortal's silhouette ───────────────────
   Drawn by hand (viewed from behind) on an offscreen canvas,
   then sampled: edge pixels become bright glyphs, the interior
   becomes a dim calligraphy weave. The body IS the text.        */
function drawSilhouette(g){
  g.fillStyle = '#fff';
  // topknot + hair (from behind)
  g.beginPath(); g.arc(100, 20, 7, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(100, 42, 17, 22, 0, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(84,52);  g.quadraticCurveTo(76,74,80,92);  g.lineTo(90,94);  g.quadraticCurveTo(86,72,92,56);  g.closePath(); g.fill();
  g.beginPath(); g.moveTo(116,52); g.quadraticCurveTo(124,74,120,92); g.lineTo(110,94); g.quadraticCurveTo(114,72,108,56); g.closePath(); g.fill();
  // main robe — narrow shoulders, cinched waist, bell of tattered silk
  g.beginPath();
  g.moveTo(90,58);
  g.bezierCurveTo(80,64,72,72,68,84);
  g.bezierCurveTo(64,100,66,118,69,136);
  g.bezierCurveTo(63,172,55,214,47,254);
  g.bezierCurveTo(43,276,39,300,42,322);
  g.bezierCurveTo(54,310,60,334,74,326);
  g.bezierCurveTo(86,318,92,344,106,334);
  g.bezierCurveTo(118,326,124,350,138,338);
  g.bezierCurveTo(148,330,152,344,164,334);
  g.bezierCurveTo(172,326,170,306,168,294);
  g.bezierCurveTo(163,268,157,240,153,214);
  g.bezierCurveTo(149,186,148,160,150,138);
  g.bezierCurveTo(152,114,149,94,141,82);
  g.bezierCurveTo(133,70,116,60,110,58);
  g.closePath(); g.fill();
  // sleeves — hung slightly apart from the body so they read as sleeves
  g.beginPath();
  g.moveTo(66,86);
  g.bezierCurveTo(54,96,45,118,41,146);
  g.bezierCurveTo(38,166,40,182,46,194);
  g.bezierCurveTo(52,202,60,200,64,192);
  g.bezierCurveTo(65,172,63,150,62,132);
  g.bezierCurveTo(61,116,62,100,66,86);
  g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(134,86);
  g.bezierCurveTo(146,96,155,118,159,146);
  g.bezierCurveTo(162,166,160,182,154,194);
  g.bezierCurveTo(148,202,140,200,136,192);
  g.bezierCurveTo(135,172,137,150,138,132);
  g.bezierCurveTo(139,116,138,100,134,86);
  g.closePath(); g.fill();
}

function mkPart(x, y, edge){
  return {
    nx: (x + R(-2, 2)) / 200, ny: (y + R(-2, 2)) / 400, edge,
    ch: R() < 0.1 ? 14 + (R() * 4 | 0) : (R() * 14 | 0),
    s:  edge ? R(9, 13.5) : R(7.5, 11.5),
    a:  edge ? R(0.8, 1)   : R(0.28, 0.55),
    wa: 0.4 + Math.pow(y / 400, 2) * 2.6,     // hem flutters more than shoulders
    wf: R(0.5, 1.4), ph: R(TAU),
    x: null, y: null, vx: 0, vy: 0
  };
}
let parts = [];
(function buildFigure(){
  const sc = document.createElement('canvas'); sc.width = 200; sc.height = 400;
  drawSilhouette(sc.getContext('2d'));
  const d = sc.getContext('2d').getImageData(0, 0, 200, 400).data;
  const ink = (x, y) => x >= 0 && y >= 0 && x < 200 && y < 400 && d[(y * 200 + x) * 4 + 3] > 90;
  const inner = [], edge = [];
  for (let y = 0; y < 400; y += 2) for (let x = 0; x < 200; x += 2){
    if (!ink(x, y)) continue;
    if (!ink(x-2,y) || !ink(x+2,y) || !ink(x,y-2) || !ink(x,y+2)) edge.push([x,y]);
    else inner.push([x,y]);
  }
  const shuffle = a => { for (let i = a.length-1; i > 0; i--){ const j = (Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
  shuffle(inner); shuffle(edge);
  for (let i = 0; i < Math.min(inner.length, 680); i++) parts.push(mkPart(inner[i][0], inner[i][1], false));
  for (let i = 0; i < Math.min(edge.length, 300);  i++) parts.push(mkPart(edge[i][0],  edge[i][1],  true));
})();

/* ─────────────────── flowing ribbons & hair strands ─────────────────── */
function mkStrand(n, segL, w0, w1, dir, alpha){
  return { n, segL, w0, w1, dir, alpha, ph: R(TAU),
           pts: Array.from({length:n}, () => ({x:0, y:0})) };
}
const strands = [
  mkStrand(16, 0.032, 0.016, 1.4, {x:-0.88, y:0.34}, 0.50),
  mkStrand(14, 0.030, 0.013, 1.2, {x: 0.90, y:0.30}, 0.45),
  mkStrand(10, 0.020, 0.007, 0.7, {x: 0.86, y:0.20}, 0.50)
];
function updateStrand(s, ax, ay, k){
  const P = s.pts; P[0].x = ax; P[0].y = ay;
  const sl = s.segL * Fh;
  for (let i = 1; i < s.n; i++){
    const p = P[i], q = P[i-1];
    p.x += ((q.x + s.dir.x * sl) - p.x) * 0.3 * k;
    p.y += ((q.y + s.dir.y * sl) - p.y) * 0.3 * k;
    p.x += wind * 2.4 * k * (i / s.n);
    p.y += (Math.sin(now * 2.6 + i * 0.5 + s.ph) * 0.32 - 0.1) * k;
  }
}
function drawStrand(s){
  const P = s.pts;
  for (let i = 1; i < s.n; i++){
    const w = lerp(s.w0 * Fh, s.w1, i / (s.n - 1));
    ctx.strokeStyle = `rgba(230,236,246,${s.alpha * (0.75 + 0.25 * Math.sin(now * 3 + i))})`;
    ctx.lineWidth = Math.max(0.7, w);
    ctx.beginPath(); ctx.moveTo(P[i-1].x, P[i-1].y); ctx.lineTo(P[i].x, P[i].y); ctx.stroke();
  }
}

/* ─────────────────────── ink-wash mountains ─────────────────────── */
function mkHs(){
  const fs = [1,2,3,5,8,13,21]; let tot = 0;
  const hs = fs.map(f => { const a = 1 / Math.pow(f, 0.85); tot += a; return {f, a, p: R(TAU)}; });
  hs.forEach(h => h.a /= tot); return hs;
}
let layers = [];
function buildLayers(){
  layers = [
    {base:0.700, top:0.575, al:0.15, col:'198,205,216', rim:0.10, par:0.25, hs:mkHs()},
    {base:0.765, top:0.615, al:0.30, col:'152,160,175', rim:0.07, par:0.45, hs:mkHs()},
    {base:0.850, top:0.705, al:0.60, col:'82,89,104',   rim:0.05, par:0.72, hs:mkHs()},
    {base:0.985, top:0.800, al:0.96, col:'12,14,19',    rim:0,    par:1.05, hs:mkHs()}
  ];
}
function layerY(L, x){
  const u = (((x + pX * L.par * 46) / W) % 1 + 1) % 1;
  let v = 0;
  for (const h of L.hs) v += h.a * Math.sin(TAU * h.f * u + h.p);
  v = v * 0.5 + 0.5;
  v = v * v * (3 - 2 * v);                 // sharpen the ridgelines a touch
  return L.base * H - (L.base - L.top) * H * v;
}
function drawLayer(L){
  ctx.beginPath(); ctx.moveTo(-4, H + 4);
  for (let x = -4; x <= W + 4; x += 4) ctx.lineTo(x, layerY(L, x));
  ctx.lineTo(W + 4, H + 4); ctx.closePath();
  ctx.fillStyle = `rgba(${L.col},${L.al})`; ctx.fill();
  if (L.rim){
    ctx.strokeStyle = `rgba(205,214,228,${L.rim})`; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = -4; x <= W + 4; x += 4){ const y = layerY(L, x); x === -4 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
    ctx.stroke();
  }
}

/* ───────────── soft sprites: moon / halo / mist / grain ───────────── */
const disc = (() => {
  const s = 256, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  r.addColorStop(0, 'rgba(235,240,248,0.55)');
  r.addColorStop(0.55, 'rgba(225,232,242,0.18)');
  r.addColorStop(1, 'rgba(225,232,242,0)');
  g.fillStyle = r; g.fillRect(0, 0, s, s); return c;
})();
const moonSpr = (() => {
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(s/2, s/2, s*0.18, s/2, s/2, s/2);
  r.addColorStop(0, 'rgba(236,236,230,0.98)');
  r.addColorStop(0.72, 'rgba(230,231,226,0.92)');
  r.addColorStop(0.88, 'rgba(226,228,226,0.45)');
  r.addColorStop(1, 'rgba(226,228,226,0)');
  g.fillStyle = r; g.beginPath(); g.arc(s/2, s/2, s/2, 0, TAU); g.fill();
  g.globalAlpha = 0.05; g.fillStyle = '#5a6070';
  [[.36,.42,.10],[.6,.35,.07],[.55,.62,.12],[.42,.66,.05]].forEach(([x,y,rr]) => {
    g.beginPath(); g.arc(x*s, y*s, rr*s, 0, TAU); g.fill();
  });
  return c;
})();
const grain = (() => {
  const s = 140, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), id = g.createImageData(s, s);
  for (let i = 0; i < id.data.length; i += 4){
    const v = Math.random() * 255 | 0;
    id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255;
  }
  g.putImageData(id, 0, 0); return c;
})();
let grPat = null, vig = null;

/* ───────────────────── drifting world state ───────────────────── */
let stars = [], snow = [], mist = [];
function buildStars(){
  stars = [];
  for (let i = 0; i < 55; i++) stars.push({x: R(W), y: R(H * 0.55), r: R(0.5, 1.1), ph: R(TAU), sp: R(0.6, 2)});
}
function buildSnow(){
  snow = [];
  const chs = [4, 5, 7, 8];                      // 風 雲 雪 霜
  for (let i = 0; i < 46; i++) snow.push({
    x: R(W), y: R(H), vy: R(12, 30), ph: R(TAU), f: R(0.4, 1.1), amp: R(6, 20),
    ch: chs[R(4)|0], s: R(7, 11), a: R(0.1, 0.28)
  });
}
function buildMist(){
  mist = [];
  for (let b = 0; b < 3; b++) for (let i = 0; i < 5; i++) mist.push({
    b, x: R(W), y: layers[b].base * H - H * 0.03 - R(0, H * 0.035),
    w: R(W * 0.28, W * 0.6), h: R(H * 0.05, H * 0.11),
    sp: R(6, 16) * (b % 2 ? 1 : -1), a: R(0.035, 0.07)
  });
}
function buildVig(){
  vig = document.createElement('canvas'); vig.width = W; vig.height = H;
  const g = vig.getContext('2d');
  const r = g.createRadialGradient(W/2, H*0.46, Math.min(W,H)*0.3, W/2, H*0.55, Math.hypot(W,H)*0.62);
  r.addColorStop(0, 'rgba(3,4,7,0)'); r.addColorStop(1, 'rgba(2,3,6,0.55)');
  g.fillStyle = r; g.fillRect(0, 0, W, H);
}

/* ────────────────────────── lightning ────────────────────────── */
function jag(x1, y1, x2, y2, disp){
  const pts = [], N = 6;
  for (let i = 0; i <= N; i++){
    const q = i / N;
    pts.push([lerp(x1, x2, q) + (i && i < N ? R(-1, 1) * disp : 0), lerp(y1, y2, q)]);
  }
  return pts;
}
function mkBolt(x1, y1, x2, y2, disp){
  const pts = [], N = 16;
  for (let i = 0; i <= N; i++){
    const q = i / N;
    pts.push([lerp(x1, x2, q) + (i && i < N ? R(-1, 1) * disp * (1 - Math.abs(q - 0.5) * 1.4) : 0), lerp(y1, y2, q)]);
  }
  const br = [], nb = 2 + (R() * 3 | 0);
  for (let b = 0; b < nb; b++){
    const i = 3 + (R() * 10 | 0), [bx, by] = pts[i];
    const a2 = Math.atan2(y2 - y1, x2 - x1) + R(-1, 1) * 0.9, ln = R(30, 110);
    br.push(jag(bx, by, bx + Math.cos(a2) * ln, by + Math.sin(a2) * ln, disp * 0.45));
  }
  return { pts, br, t: 0, max: R(0.4, 0.55), seed: R(20) };
}
let bolts = [];
function drawPath(pts){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
}
function ambientBolt(){
  let tx, ty, absorb = false;
  if (Math.random() < 0.32){ absorb = true; tx = swordX + R(-30, 30); ty = swordY; }
  else {
    const L = layers[1 + (R() * 2 | 0)];
    tx = R(W * 0.05, W * 0.95); ty = layerY(L, tx) + R(0, H * 0.06);
  }
  bolts.push(mkBolt(tx + R(-120, 120), -40, tx, ty, R(24, 42)));
  flash = Math.min(1, Math.max(flash, 0.55));
  if (absorb){ swordFlash = 1; spawnArc(true); }
  burstSparks(tx, ty, 12, 260);
  setTimeout(() => thunder(absorb ? 1 : 0.8), R(80, 320));
}

/* ────────────────── sword-qi arcs on the blade ────────────────── */
let arcs = [];
function spawnArc(burst){
  const n = burst ? 3 : 1;
  for (let k = 0; k < n; k++){
    const cx = swordX + R(-Fh * 0.3, Fh * 0.3), cy = swordY + R(-4, 4);
    const len = R(8, 26) * (Math.random() < 0.5 ? -1 : 1);
    const pts = [[cx, cy]];
    for (let i = 1; i < 4; i++) pts.push([lerp(cx, cx + len, i / 4) + R(-4, 4), cy + R(-7, 7)]);
    pts.push([cx + len, cy + R(-5, 5)]);
    arcs.push({ pts, life: 0, max: R(0.12, 0.22) });
  }
}

/* ─────────────────────── sword draw (FX) ─────────────────────── */
let slashes = [], rings = [], sparks = [], slashChars = [], wisps = [];
const SLASH_CHARS = ['斬','斬','斬','絕','滅','裂'];
function burstSparks(x, y, n, pow){
  for (let i = 0; i < n; i++){
    const a = R(TAU), v = R(40, pow);
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, t: 0, life: R(0.3, 0.7) });
  }
}
function doSlash(tx, ty, auto){
  tx = clamp(tx, 50, W - 50); ty = clamp(ty, 70, H - 150);
  const ang = Math.atan2(ty - fcyCur, tx - fxCur);
  slashes.push({ t: 0, dur: 0.55, ang, cx: fxCur, cy: fcyCur, tx, ty });
  rings.push({ x: fxCur, y: fcyCur, r: Fh * 0.12, v: Fh * 2.6, a: 0.5 });
  flash = Math.min(1, flash + (auto ? 0.3 : 0.55));
  for (const p of parts){
    const sp = R(140, 430);
    p.vx += Math.cos(ang) * sp + R(-60, 60);
    p.vy += Math.sin(ang) * sp * 0.7 + R(-60, 60) - 30;
  }
  burstSparks(tx, ty, 14, 320);
  slashChars.push({ x: tx, y: ty, ch: SLASH_CHARS[R(SLASH_CHARS.length)|0],
                    t: 0, life: 0.95, rot: R(-0.22, 0.22),
                    s: clamp(Fh * (auto ? 0.3 : 0.36), 60, 150) });
  bolts.push(mkBolt(tx + R(-90, 90), -40, tx, ty, R(26, 40)));   // the slash calls the storm
  swordFlash = 1; spawnArc(true);
  slashSound();
  setTimeout(() => thunder(0.7), 120);
}
function autoSlash(){
  const a = R(TAU);
  doSlash(fxCur + Math.cos(a) * W * 0.32, fcyCur + Math.sin(a) * H * 0.3, true);
}
function spawnWisp(){
  if (wisps.length > 40) return;
  wisps.push({ x: swordX + R(-Fh * 0.3, Fh * 0.3), y: swordY + R(2, 8),
               vy: R(30, 70), life: 1, len: R(10, 26), sw: R(TAU) });
}

/* ──────────────────────────── audio ──────────────────────────── */
let AC = null, master = null, noiseBuf = null, soundOn = true;
function initAudio(){
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  master = AC.createGain(); master.gain.value = soundOn ? 0.55 : 0; master.connect(AC.destination);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  // wind bed
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 240; f.Q.value = 0.6;
  const g = AC.createGain(); g.gain.value = 0.05;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
function thunder(v){
  if (!AC) return;
  const dur = 1.7, src = AC.createBufferSource();
  const b = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate), d = b.getChannelData(0);
  let e = 1;
  for (let i = 0; i < d.length; i++){ e *= 0.9994; d[i] = (Math.random() * 2 - 1) * e * (i < 400 ? i / 400 : 1); }
  src.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass';
  f.frequency.setValueAtTime(420, AC.currentTime);
  f.frequency.exponentialRampToValueAtTime(55, AC.currentTime + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(v * 0.9, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
function slashSound(){
  if (!AC) return;
  const t0 = AC.currentTime;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(3800, t0);
  bp.frequency.exponentialRampToValueAtTime(320, t0 + 0.34);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.4);
  src.connect(bp); bp.connect(g); g.connect(master); src.start(t0); src.stop(t0 + 0.45);
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(2900, t0);
  o.frequency.exponentialRampToValueAtTime(1700, t0 + 0.5);
  const og = AC.createGain();
  og.gain.setValueAtTime(0.09, t0);
  og.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.55);
  o.connect(og); og.connect(master); o.start(t0); o.stop(t0 + 0.6);
}

/* ─────────────────────────── input ─────────────────────────── */
const hintEl = document.getElementById('hint');
addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (px !== undefined) windT = clamp(windT + (x - px) * 0.01, -2.2, 2.2);
  px = x; py = y;
  mX = (x / W) * 2 - 1; mY = (y / H) * 2 - 1;
});
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.hud')) return;
  initAudio();
  hintEl.classList.add('gone');
  doSlash(e.clientX, e.clientY, false);
});
addEventListener('keydown', e => {
  if (e.code === 'Space'){
    e.preventDefault(); initAudio(); hintEl.classList.add('gone');
    doSlash(R(W * 0.15, W * 0.85), R(H * 0.2, H * 0.75), false);
  }
});
document.getElementById('snd').addEventListener('click', () => {
  soundOn = !soundOn;
  if (master) master.gain.value = soundOn ? 0.55 : 0;
  document.getElementById('icOn').style.display  = soundOn ? '' : 'none';
  document.getElementById('icOff').style.display = soundOn ? 'none' : '';
});

/* ─────────────────────────── render ─────────────────────────── */
function drawSword(){
  const L = Fh * 0.8, ang = -0.10 + Math.sin(now * 0.9) * 0.025 + wind * 0.02;
  const w1 = Math.max(2.5, Fh * 0.011);
  ctx.save(); ctx.translate(swordX, swordY); ctx.rotate(ang);
  ctx.shadowColor = 'rgba(225,238,255,0.9)'; ctx.shadowBlur = 14 + swordFlash * 26;
  ctx.beginPath();
  ctx.moveTo(-L * 0.34, -w1); ctx.lineTo(L * 0.5, 0); ctx.lineTo(-L * 0.34, w1);
  ctx.lineTo(-L * 0.42, w1 * 0.8); ctx.lineTo(-L * 0.42, -w1 * 0.8); ctx.closePath();
  ctx.fillStyle = `rgba(233,238,246,${0.92 + swordFlash * 0.08})`; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(240,244,250,0.95)'; ctx.lineWidth = Math.max(1.5, w1 * 0.55);
  ctx.beginPath(); ctx.moveTo(-L * 0.42, 0); ctx.lineTo(-L * 0.5, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-L * 0.34, -w1 * 2.1); ctx.lineTo(-L * 0.34, w1 * 2.1); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-L * 0.3, -w1 * 0.35); ctx.lineTo(L * 0.46, -w1 * 0.12); ctx.stroke();
  ctx.restore();
}

function frame(ts){
  const t = ts / 1000, dt = Math.min(0.05, t - (frame.last || t)); frame.last = t; now = t;
  const k = clamp(dt * 60, 0.5, 2);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // world state
  wind = clamp(lerp(wind, windT + Math.sin(t * 0.33) * 0.45, 0.03), -2.2, 2.2);
  windT *= Math.pow(0.4, dt);
  pX = lerp(pX, mX, 0.04); pY = lerp(pY, mY, 0.04);
  flash = Math.max(0, flash - dt * 2.1);
  swordFlash = Math.max(0, swordFlash - dt * 2.8);

  // figure frame values (gentle hover)
  const bobY = Math.sin(t * 1.05) * Fh * 0.008;
  const bobX = Math.sin(t * 0.6) * Fh * 0.003 + wind * Fh * 0.006;
  fxCur = FX + bobX + pX * 7; feetCur = FEET + bobY; fyTop = feetCur - Fh;
  fcyCur = fyTop + Fh * 0.45;
  swordX = fxCur; swordY = fyTop + Fh * 0.9;

  // schedules (the storm lives on its own — good for GIF loops)
  if (t > nextBolt){ ambientBolt(); nextBolt = t + R(4.5, 9); }
  if (t > nextAuto){ autoSlash(); nextAuto = t + R(9, 14); }
  if (t > nextArc){ spawnArc(false); nextArc = t + R(0.7, 2.4); }
  if (t > nextWisp){ spawnWisp(); nextWisp = t + R(0.05, 0.14); }

  // ── sky ──
  ctx.fillStyle = '#06070a'; ctx.fillRect(0, 0, W, H);
  for (const s of stars){
    ctx.globalAlpha = 0.12 + 0.25 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = '#dfe5ee';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // giant 冷 breathing behind the moon
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = Math.round(H * 0.42) + 'px "Ma Shan Zheng", serif';
  ctx.fillStyle = `rgba(226,231,240,${0.05 + 0.02 * Math.sin(t * 0.5) + flash * 0.13})`;
  ctx.fillText('冷', W * 0.335, H * 0.315);

  // moon
  const mr = H * 0.135;
  ctx.globalAlpha = 0.95;
  ctx.drawImage(moonSpr, W * 0.40 + pX * 12 - mr, H * 0.285 + pY * 8 - mr, mr * 2, mr * 2);
  ctx.globalAlpha = 1;

  // halo of moonlight behind the immortal
  ctx.globalAlpha = 0.12 + flash * 0.08;
  ctx.drawImage(disc, fxCur - Fh * 0.55, fcyCur - Fh * 0.55, Fh * 1.1, Fh * 1.1);
  ctx.globalAlpha = 1;

  // ── far mountains + mist ──
  drawLayer(layers[0]); drawMistBand(0);
  drawLayer(layers[1]); drawMistBand(1);

  // ── sword-qi wisps trailing below the blade ──
  for (const w of wisps){
    w.y += w.vy * dt; w.life -= dt * 0.9;
    w.x += (wind * 22 + Math.sin(t * 2 + w.sw) * 8) * dt;
    ctx.strokeStyle = `rgba(205,218,236,${0.22 * Math.max(0, w.life)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(w.x, w.y); ctx.lineTo(w.x - 6, w.y - w.len); ctx.stroke();
  }
  wisps = wisps.filter(w => w.life > 0);

  // ── THE IMMORTAL — a body of living calligraphy ──
  const Fw = Fh * 0.5, ui = clamp(Fh / 420, 0.7, 1.4);
  for (const p of parts){
    if (R() < dt * 0.05) p.ch = R() < 0.1 ? 14 + (R() * 4 | 0) : (R() * 14 | 0); // glyphs re-write themselves
    const hx = fxCur + (p.nx - 0.5) * Fw, hy = fyTop + p.ny * Fh;
    if (p.x === null){ p.x = fxCur + R(-W * 0.45, W * 0.45); p.y = R(0, H); }
    const ox = Math.sin(t * p.wf + p.ph) * p.wa * (0.6 + wind * 0.9);
    const oy = Math.cos(t * p.wf * 0.83 + p.ph) * p.wa * 0.5;
    p.vx += (hx + ox - p.x) * 0.06; p.vy += (hy + oy - p.y) * 0.06;
    p.vx *= 0.82; p.vy *= 0.82; p.x += p.vx; p.y += p.vy;
    ctx.globalAlpha = Math.min(1, p.a * (0.72 + 0.28 * Math.sin(t * 2.1 + p.ph)) + flash * 0.25);
    const s = p.s * ui;
    ctx.drawImage(glyphs[p.ch], p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;

  drawSword();

  // crackling arcs along the blade
  ctx.save(); ctx.shadowColor = 'rgba(200,225,255,0.9)'; ctx.shadowBlur = 6;
  for (const a of arcs){
    const q = 1 - a.life / a.max;
    ctx.strokeStyle = `rgba(215,232,255,${0.35 * q})`; ctx.lineWidth = 2.2;
    drawPath(a.pts); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${q})`; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.restore();
  arcs = arcs.filter(a => (a.life += dt) < a.max);

  // ribbons & hair
  updateStrand(strands[0], fxCur + (0.325 - 0.5) * Fw, fyTop + 0.375 * Fh, k);
  updateStrand(strands[1], fxCur + (0.675 - 0.5) * Fw, fyTop + 0.375 * Fh, k);
  updateStrand(strands[2], fxCur, fyTop + 0.05 * Fh, k);
  drawStrand(strands[0]); drawStrand(strands[1]); drawStrand(strands[2]);

  // ── foreground ridges ──
  drawLayer(layers[2]); drawMistBand(2);
  drawLayer(layers[3]);

  // ── ink-snow (falling characters) ──
  for (const s of snow){
    s.y += s.vy * dt;
    s.x += Math.sin(t * s.f + s.ph) * s.amp * dt + wind * 14 * dt;
    if (s.y > H + 12){ s.y = -12; s.x = R(W); }
    if (s.x > W + 12) s.x = -12; if (s.x < -12) s.x = W + 12;
    ctx.globalAlpha = s.a;
    ctx.drawImage(glyphs[s.ch], s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // ── lightning ──
  for (const b of bolts){
    const q = b.t / b.max, a = (1 - q) * (0.55 + 0.45 * Math.sin(t * 80 + b.seed));
    ctx.save(); ctx.shadowColor = 'rgba(200,225,255,0.9)'; ctx.shadowBlur = 10;
    ctx.strokeStyle = `rgba(205,222,250,${0.28 * a})`; ctx.lineWidth = 5; drawPath(b.pts); ctx.stroke();
    ctx.strokeStyle = `rgba(235,244,255,${0.75 * a})`; ctx.lineWidth = 2; ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 1; ctx.stroke();
    ctx.shadowBlur = 6;
    ctx.strokeStyle = `rgba(230,240,255,${0.5 * a})`; ctx.lineWidth = 1;
    for (const br of b.br){ drawPath(br); ctx.stroke(); }
    ctx.restore();
  }
  bolts = bolts.filter(b => (b.t += dt) < b.max);

  // ── slash FX ──
  for (const s of slashes){
    const pr = s.t / s.dur, e = 1 - Math.pow(1 - pr, 3);
    const rad = lerp(Fh * 0.15, Math.hypot(W, H) * 0.5, e), a = 1 - pr;
    ctx.strokeStyle = `rgba(240,246,255,${0.75 * a})`; ctx.lineWidth = lerp(10, 1.2, e);
    ctx.beginPath(); ctx.arc(s.cx, s.cy, rad, s.ang - 0.7, s.ang + 0.7); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${0.9 * a})`; ctx.lineWidth = lerp(3, 0.6, e);
    ctx.beginPath(); ctx.arc(s.cx, s.cy, rad * 0.985, s.ang - 0.55, s.ang + 0.55); ctx.stroke();
    // the cut itself
    if (pr < 0.35){
      const la = 1 - pr / 0.35;
      ctx.strokeStyle = `rgba(255,255,255,${0.9 * la})`; ctx.lineWidth = lerp(3.5, 0.5, 1 - la);
      ctx.beginPath(); ctx.moveTo(s.cx, s.cy); ctx.lineTo(s.tx, s.ty); ctx.stroke();
      ctx.strokeStyle = `rgba(215,230,252,${0.2 * la})`; ctx.lineWidth = 10;
      ctx.stroke();
    }
  }
  slashes = slashes.filter(s => (s.t += dt) < s.dur);

  for (const r of rings){
    ctx.strokeStyle = `rgba(235,242,255,${r.a})`; ctx.lineWidth = 2.5 + 2 * r.a;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    r.r += r.v * dt; r.v *= Math.pow(0.35, dt); r.a *= Math.pow(0.02, dt);
  }
  rings = rings.filter(r => r.a > 0.02);

  for (const p of sparks){
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
    p.vx *= Math.pow(0.5, dt * 2);
    ctx.strokeStyle = `rgba(240,246,255,${0.9 * (1 - p.t / p.life)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
  }
  sparks = sparks.filter(p => p.t < p.life);

  for (const c of slashChars){
    const q = c.t / c.life;
    const a = q < 0.1 ? q / 0.1 : 1 - (q - 0.1) / 0.9;
    const sc = 0.75 + 0.45 * (1 - Math.pow(1 - Math.min(1, q / 0.35), 3));
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = Math.round(c.s) + 'px "Ma Shan Zheng", serif';
    ctx.globalAlpha = a * 0.25; ctx.shadowColor = 'rgba(220,235,255,0.8)'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#fff'; ctx.fillText(c.ch, 0, 0);   // ink-bleed echo
    ctx.shadowBlur = 0; ctx.globalAlpha = a;
    ctx.fillText(c.ch, 0, 0);
    ctx.restore();
  }
  slashChars = slashChars.filter(c => (c.t += dt) < c.life);

  // ── storm flash / vignette / grain ──
  if (flash > 0.003){ ctx.fillStyle = `rgba(216,228,252,${flash * 0.14})`; ctx.fillRect(0, 0, W, H); }
  ctx.drawImage(vig, 0, 0, W, H);
  ctx.save();
  ctx.globalAlpha = 0.045;
  const gx = (Math.random() * 140) | 0, gy = (Math.random() * 140) | 0;
  ctx.translate(-gx, -gy);
  ctx.fillStyle = grPat; ctx.fillRect(0, 0, W + 140, H + 140);
  ctx.restore();

  requestAnimationFrame(frame);
}

function drawMistBand(b){
  for (const m of mist){
    if (m.b !== b) continue;
    m.x += (m.sp + wind * 10) * dt0();
    if (m.x > W + m.w / 2) m.x = -m.w / 2;
    if (m.x < -m.w / 2) m.x = W + m.w / 2;
    ctx.globalAlpha = m.a + flash * 0.05;
    ctx.drawImage(disc, m.x - m.w / 2, m.y - m.h / 2, m.w, m.h);
  }
  ctx.globalAlpha = 1;
}
let _lastTs = 0;
function dt0(){ return 0.016; }   // mist uses a steady drift

/* ─────────────────────────── boot ─────────────────────────── */
function resize(){
  W = innerWidth; H = innerHeight;
  DPR = Math.min(1.75, devicePixelRatio || 1);
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  FX = W < 760 ? W * 0.5 : W * 0.56;
  FEET = H * 0.60;
  Fh = clamp(H * 0.42, 240, 560);
  fxCur = FX; feetCur = FEET; fyTop = FEET - Fh; fcyCur = fyTop + Fh * 0.45;
  swordX = fxCur; swordY = fyTop + Fh * 0.9;
  buildLayers(); buildStars(); buildMist(); buildSnow(); buildVig();
  grPat = ctx.createPattern(grain, 'repeat');
}
addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
