<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冷 · LENG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; background: #0a0b0f; font-family: 'Cinzel', serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }

  .title {
    text-align: center;
    opacity: 0;
    animation: fadeIn 2s ease forwards 1s;
  }

  .title-char {
    font-family: 'Ma Shan Zheng', serif;
    font-size: clamp(80px, 20vw, 200px);
    color: rgba(226, 231, 240, 0.95);
    letter-spacing: 0.15em;
    margin: 0;
    line-height: 1;
    text-shadow: 0 0 20px rgba(150, 180, 255, 0.3);
  }

  .title-sub {
    font-size: clamp(14px, 2vw, 20px);
    color: rgba(150, 160, 190, 0.8);
    letter-spacing: 0.3em;
    margin-top: 20px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 2s ease forwards 1.5s;
  }

  .hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: rgba(150, 160, 180, 0.5);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn 2s ease forwards 3s;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @media (max-width: 768px) {
    .title-char { font-size: clamp(60px, 18vw, 120px); }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="overlay">
  <div class="title">
    <h1 class="title-char">冷</h1>
    <p class="title-sub">LENG</p>
  </div>
</div>

<div class="hint">The Sword Immortal</div>

<script>
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, DPR;
let time = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = window.devicePixelRatio || 1;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function drawMountains(baseY, opacity, parallax) {
  ctx.fillStyle = `rgba(40, 50, 80, ${opacity})`;
  ctx.beginPath();
  ctx.moveTo(-50, H);

  let seed = Date.now() * 0.0001;
  for (let x = 0; x < W + 100; x += 20) {
    const y = baseY + Math.sin((x + parallax * seed) * 0.005) * 60 + Math.cos(x * 0.002) * 40;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }

  ctx.lineTo(W + 50, H);
  ctx.closePath();
  ctx.fill();
}

function drawSword(x, y, angle, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);

  // Blade
  ctx.shadowColor = 'rgba(150, 180, 255, 0.6)';
  ctx.shadowBlur = 15;
  ctx.fillStyle = 'rgba(220, 230, 250, 0.95)';
  ctx.beginPath();
  ctx.moveTo(-15, 0);
  ctx.lineTo(60, -8);
  ctx.lineTo(65, 0);
  ctx.lineTo(60, 8);
  ctx.closePath();
  ctx.fill();

  // Hilt
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#8b6f47';
  ctx.fillRect(-15, -5, 12, 10);

  ctx.restore();
}

function drawKanji(text, x, y, size, opacity) {
  ctx.font = `${size}px 'Ma Shan Zheng', serif`;
  ctx.fillStyle = `rgba(150, 180, 255, ${opacity})`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}

function frame(ts) {
  time = ts / 1000;

  // Clear
  ctx.fillStyle = '#0a0b0f';
  ctx.fillRect(0, 0, W, H);

  // Draw layered mountains
  drawMountains(H * 0.7, 0.1, time * 0.3);
  drawMountains(H * 0.65, 0.2, time * 0.2);
  drawMountains(H * 0.6, 0.35, time * 0.1);

  // Draw sword
  const swordY = H * 0.4 + Math.sin(time * 0.5) * 20;
  const swordAngle = -0.15 + Math.sin(time * 0.3) * 0.05;
  drawSword(W * 0.5, swordY, swordAngle, 1.2);

  // Draw floating kanji around sword
  const kanji = ['劍', '冷', '天', '命', '風'];
  for (let i = 0; i < kanji.length; i++) {
    const angle = (i / kanji.length) * Math.PI * 2 + time * 0.3;
    const radius = 120 + Math.sin(time + i) * 20;
    const x = W * 0.5 + Math.cos(angle) * radius;
    const y = swordY + Math.sin(angle) * radius;
    const opacity = 0.3 + Math.sin(time * 2 + i) * 0.2;
    drawKanji(kanji[i], x, y, 24, opacity);
  }

  // Draw mystical lines/energy
  ctx.strokeStyle = 'rgba(150, 180, 255, 0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(W * 0.5, swordY, 80 + Math.sin(time) * 10, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(W * 0.5, swordY, 150 + Math.cos(time * 0.7) * 15, 0, Math.PI * 2);
  ctx.stroke();

  requestAnimationFrame(frame);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
